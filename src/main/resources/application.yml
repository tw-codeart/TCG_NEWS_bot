spring:
  application:
    name: tcg-news-bot
  datasource:
    url: jdbc:h2:file:./data/tcg-news
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

rsshub:
  enabled: ${RSSHUB_ENABLED:false}
  base-url: ${RSSHUB_BASE_URL:}
  ws-route: ${RSSHUB_WS_ROUTE:/twitter/user/wstcg}
