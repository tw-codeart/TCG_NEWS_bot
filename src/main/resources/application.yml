spring:
  application:
    name: tcg-news-bot
  datasource:
    url: jdbc:h2:file:./data/tcg-news
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

rsshub:
  ocg-enabled: ${RSSHUB_OCG_ENABLED:false}
  ocg-route: ${RSSHUB_OCG_ROUTE:/twitter/user/YuGiOh_OCG_INFO}
  enabled: ${RSSHUB_ENABLED:false}
  base-url: ${RSSHUB_BASE_URL:}
  ws-route: ${RSSHUB_WS_ROUTE:/twitter/user/wstcg}
  notification-batch-limit: ${RSSHUB_NOTIFICATION_BATCH_LIMIT:3}
  polling-enabled: ${RSSHUB_POLLING_ENABLED:false}
  polling-interval: ${RSSHUB_POLLING_INTERVAL:PT5M}

logging:
  charset:
    console: UTF-8

qq:
  image-forward-enabled: ${QQ_IMAGE_FORWARD_ENABLED:true}
  ocr-enabled: ${QQ_OCR_ENABLED:true}
  enabled: ${QQ_ENABLED:false}
  api-base-url: ${QQ_API_BASE_URL:http://localhost:3000}
  test-group-id: ${QQ_TEST_GROUP_ID:}
  access-token: ${QQ_ACCESS_TOKEN:}
