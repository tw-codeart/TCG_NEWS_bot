name: tcg-news-bot

services:
  rsshub:
    image: ${RSSHUB_IMAGE:-diygod/rsshub@sha256:9702431d8d8cb8e3bf08a0fa3275ec05343c0ec65b8d15c5c772f7ba541fae74}
    restart: unless-stopped
    ports:
      - "127.0.0.1:1200:1200"
    environment:
      PORT: "1200"
      NODE_ENV: production
      LISTEN_INADDR_ANY: "true"
      DISABLE_IPV6: "true"
      CACHE_TYPE: memory
      CACHE_EXPIRE: "300"
      NO_LOGFILES: "true"
      LOGGER_LEVEL: info
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcg-news-bot:local
    restart: unless-stopped
    depends_on:
      rsshub:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Tokyo
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/tcg-news
      RSSHUB_ENABLED: "true"
      RSSHUB_BASE_URL: http://rsshub:1200
      RSSHUB_WS_ROUTE: ${RSSHUB_WS_ROUTE:-/twitter/user/wstcg}
      RSSHUB_NOTIFICATION_BATCH_LIMIT: ${RSSHUB_NOTIFICATION_BATCH_LIMIT:-3}
      RSSHUB_POLLING_ENABLED: ${RSSHUB_POLLING_ENABLED:-false}
      RSSHUB_POLLING_INTERVAL: ${RSSHUB_POLLING_INTERVAL:-PT5M}
      QQ_ENABLED: ${QQ_ENABLED:-false}
      QQ_API_BASE_URL: ${QQ_API_BASE_URL:-http://host.docker.internal:3000}
      QQ_TEST_GROUP_ID: ${QQ_TEST_GROUP_ID:-}
      QQ_ACCESS_TOKEN: ${QQ_ACCESS_TOKEN:-}
    volumes:
      - news-data:/app/data

volumes:
  news-data:
